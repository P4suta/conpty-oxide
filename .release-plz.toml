[workspace]
# The changelog is hand-curated. release-plz's generator does not recognize
# this file's custom header and would prepend a second one, so the release
# pull request only bumps the version; moving the Unreleased notes into the
# new release section stays a review-time edit.
changelog_update = false
dependencies_update = false
release_always = false
git_release_draft = true
git_release_latest = false
git_release_type = "auto"
git_tag_name = "v{{ version }}"
publish_all_features = true
publish_no_verify = false
publish_timeout = "30m"
semver_check = true
