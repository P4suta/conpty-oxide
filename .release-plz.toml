[workspace]
# The changelog is hand-curated. release-plz's generator does not recognize
# this file's custom header and would prepend a second one, so the release
# pull request only bumps the version; moving the Unreleased notes into the
# new release section stays a review-time edit.
changelog_update = false
dependencies_update = false
# `release_always` is left at its default of true. Setting it to false makes
# release-plz publish only from a commit it authored through its own release
# pull request, so any version bump made by hand -- or any release pull request
# edited before merge -- leaves the crate permanently unreleasable: no release
# pull request is proposed because the version is already ahead, and no release
# happens because there was no release pull request.
git_release_draft = true
git_release_latest = false
git_release_type = "auto"
git_tag_name = "v{{ version }}"
publish_all_features = true
publish_no_verify = false
publish_timeout = "30m"
semver_check = true
