[package]
name = "conpty-oxide"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "Correctness-first Windows ConPTY (pseudoconsole) library with sync and async (tokio) APIs"
repository = "https://github.com/P4suta/conpty-oxide"
readme = "README.md"
keywords = ["conpty", "pty", "pseudoconsole", "windows", "terminal"]
categories = ["os::windows-apis", "asynchronous"]

[features]
default = ["blocking"]
blocking = []
tokio = ["dep:tokio"]
tracing = ["dep:tracing"]

[[example]]
name = "blocking_echo"
required-features = ["blocking"]

[[example]]
name = "tokio_interactive"
required-features = ["tokio"]

[target.'cfg(windows)'.dependencies]
thiserror = "2"
tokio = { version = "1", optional = true, features = ["net", "rt", "sync"] }
tracing = { version = "0.1", optional = true }

[target.'cfg(windows)'.dev-dependencies.windows-sys]
version = "0.61"
features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"]

# Tests, doctests, and the `tokio_interactive` example need more of tokio than
# the library does — a runtime to start, the `#[tokio::test]` macro, the
# `AsyncReadExt`/`AsyncWriteExt` extension traits, and timeouts. Keeping those
# here rather than in the optional dependency above means users of the `tokio`
# feature only pay for `net`, `rt`, and `sync`.
[target.'cfg(windows)'.dev-dependencies.tokio]
version = "1"
features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"]

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_System_IO",
]

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
