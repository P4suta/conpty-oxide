[package]
name = "conpty-oxide"
version = "0.1.2"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "Correctness-first Windows ConPTY (pseudoconsole) library with sync and async (tokio) APIs"
repository = "https://github.com/P4suta/conpty-oxide"
documentation = "https://docs.rs/conpty-oxide"
readme = "README.md"
keywords = ["conpty", "pty", "pseudoconsole", "windows", "terminal"]
categories = ["os::windows-apis", "asynchronous"]
# No `publish` restriction: release-plz cannot resolve the reserved
# `crates-io` registry name from `publish = ["crates-io"]`, and an empty
# field already means "publish to crates.io".
include = [
  "/src/**",
  "/tests/**",
  "/examples/**",
  "/README.md",
  "/CHANGELOG.md",
  "/docs/conpty-pitfalls.md",
  "/REUSE.toml",
  "/LICENSE-APACHE",
  "/LICENSE-MIT",
  "/LICENSES/**",
]

[features]
default = ["blocking"]
blocking = []
tokio = ["dep:tokio"]
tracing = ["dep:tracing"]

[[example]]
name = "blocking_echo"
required-features = ["blocking"]

[[example]]
name = "tokio_interactive"
required-features = ["tokio"]

[target.'cfg(windows)'.dependencies]
windows-spawn = "0.1.0"
thiserror = "2"
tokio = { version = "1", optional = true, features = ["net", "rt"] }
tracing = { version = "0.1", optional = true }

[target.'cfg(windows)'.dev-dependencies.windows-sys]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
]

# Tests, doctests, and the `tokio_interactive` example need more of tokio than
# the library does — a runtime to start, the `#[tokio::test]` macro, the
# `AsyncReadExt`/`AsyncWriteExt` extension traits, channels, and timeouts.
# Keeping those here rather than in the optional dependency above means users
# of the `tokio` feature only pay for `net` and `rt`.
[target.'cfg(windows)'.dev-dependencies.tokio]
version = "1"
features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"]

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_System_IO",
]

# docs.rs builds with default features unless told otherwise, which would drop
# the whole async front end from the published API reference. `--cfg docsrs`
# additionally enables the nightly `doc_cfg` badges (see src/lib.rs).
[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# These nursery lints have a low false-positive rate and encode policies we
# intentionally want to keep across compiler upgrades. The nursery group as a
# whole is deliberately not enabled because it is unstable by definition.
assigning_clones = "deny"
doc_link_code = "deny"
future_not_send = "deny"
missing_const_for_fn = "deny"
needless_collect = "deny"
option_if_let_else = "deny"
rc_buffer = "deny"
redundant_clone = "deny"

# Intentionally omitted: this lint also fires on `pub(super)` items whose
# parent is the crate root, and recommends widening them to `pub`. That would
# expose private domain modules and then conflict with `unreachable_pub`.
# `unreachable_pub` above enforces the externally relevant boundary.

# Test code gets diagnostic panics, but placeholders and debug macros are
# never acceptable in a checked-in target.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
