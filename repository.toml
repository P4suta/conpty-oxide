name = "conpty-oxide"
summary = "Run Windows ConPTY sessions through blocking and Tokio Rust APIs"
install = "cargo add conpty-oxide"
usage_language = "rust"
usage = '''
use conpty_oxide::blocking::Command;

fn main() -> conpty_oxide::Result<()> {
    let status = Command::new("cmd.exe")
        .args(["/d", "/c", "echo", "hello"])
        .spawn()?
        .wait()?;

    assert!(status.success());
    Ok(())
}
'''
documentation_index = true
copyright = "2026 conpty-oxide contributors"
license = "MIT OR Apache-2.0"

[[consent]]
contributor = "Yasunobu"
evidence = "https://github.com/P4suta/conpty-oxide/commit/c2381efec763b08df26d96b1ee360e0b6e1b8788"
