name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    name: Hygiene
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1 (stable)
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy (no default features)
        run: cargo clippy --no-default-features --all-targets -- -D warnings
      - name: clippy (default features)
        run: cargo clippy --all-targets -- -D warnings
      - name: clippy (tokio)
        run: cargo clippy --features tokio --all-targets -- -D warnings
      - name: clippy (all features)
        run: cargo clippy --all-features --all-targets -- -D warnings
      # Rustdoc's own diagnostics — broken intra-doc links, unclosed code
      # fences, invalid HTML — are invisible to `cargo build` and `cargo
      # clippy`, so a published page can rot without any other job noticing.
      # `-D warnings` also promotes the crate's `#![warn(missing_docs)]`, which
      # makes this the second gate on an undocumented public item.
      - name: rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --all-features --no-deps
      - name: typos
        uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # v1.48.0

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
        rust: [stable, "1.75"]
        # Pin which ConPTY lifecycle mode each leg is expected to exercise:
        # Server 2022 predates ReleasePseudoConsole (legacy shutdown path),
        # windows-latest (Server 2025, build 26100+) exports it (released
        # path). The suite asserts this via CONPTY_OXIDE_EXPECT_RELEASE, so a
        # matrix or runner-image change that silently drops one mode's
        # coverage fails loudly instead.
        include:
          - os: windows-2022
            expect_release: "0"
          - os: windows-latest
            expect_release: "1"
    runs-on: ${{ matrix.os }}
    env:
      CONPTY_OXIDE_EXPECT_RELEASE: ${{ matrix.expect_release }}
      # The bundled conpty.dll is fetched below on every leg, so the two
      # variables together cover the product: windows-2022 runs a legacy
      # system ConPTY alongside a modern bundle, windows-latest a released
      # system ConPTY alongside the same bundle. The bundle's own lifecycle
      # mode does not depend on the runner image, which is exactly why the
      # external-backend tests are worth running on both.
      CONPTY_OXIDE_TEST_DLL_DIR: ${{ github.workspace }}/vendor/conpty
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-nextest
      # The package is version-pinned and checksum-pinned inside the script,
      # so keying the cache on the script's hash invalidates it exactly when
      # the pin moves and never otherwise.
      - name: cache the ConPTY package
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/.package
          key: conpty-package-${{ hashFiles('scripts/fetch-conpty.ps1') }}
      # Verifies the SHA-256 (cached or freshly downloaded) and that the
      # extracted conpty.dll and OpenConsole.exe report the same
      # ProductVersion, so a tampered or mismatched bundle fails here rather
      # than as a puzzling crash inside a test.
      - name: fetch the bundled ConPTY
        shell: pwsh
        run: ./scripts/fetch-conpty.ps1
      - name: build
        run: cargo build --all-features
      - name: test
        run: cargo nextest run --all-features --no-tests=pass
      # nextest cannot run doctests, so without this step the examples in the
      # public documentation are never compiled or executed by CI. Running them
      # here rather than in `hygiene` puts them on the same OS × toolchain
      # matrix as the rest of the suite: the doctests are the API's advertised
      # usage, so they should be held to the MSRV and to both ConPTY lifecycle
      # modes like every other caller.
      - name: doctests
        run: cargo test --all-features --doc

  ci-required:
    name: CI required
    if: always()
    needs: [hygiene, test]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
