---
# SPDX-FileCopyrightText: 2026 conpty-oxide contributors <https://github.com/P4suta/conpty-oxide/graphs/contributors>
# SPDX-License-Identifier: MIT OR Apache-2.0

name: CI

"on":
  pull_request:
  merge_group:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  policy:
    name: Repository policy
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
      - name: Select stable Rust
        run: rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14  # v4
        with:
          version: 2026.7.13
          # Avoid cold-installing test, coverage, mutation, hook, and API
          # tools that this job never invokes.
          install_args: >-
            just
            aqua:EmbarkStudios/cargo-deny
            aqua:koalaman/shellcheck
            aqua:rhysd/actionlint
            aqua:rvben/rumdl
            cargo:cargo-shear
            cargo:typos-cli
            cargo:taplo-cli
            uv
            pipx:reuse
            pipx:yamllint
      - name: Run repository policy
        run: just policy

  hygiene:
    name: Rust hygiene
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install the minimum Rust version
        run: rustup toolchain install 1.75.0 --profile minimal --no-self-update
      - name: Install the documentation toolchain
        run: rustup toolchain install nightly-2026-07-02 --profile minimal --no-self-update
      # Install stable last so it remains the default for Clippy. The MSRV
      # and docs.rs recipes select their pinned toolchains explicitly.
      - name: Install stable Rust and supported targets
        run: >-
          rustup toolchain install stable --profile minimal
          --component rustfmt --component clippy
          --target x86_64-pc-windows-msvc --target i686-pc-windows-msvc
          --target aarch64-pc-windows-msvc --no-self-update
      - name: Select stable Rust
        run: rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf  # v2.85.2
        with:
          tool: just@1.57.0,cargo-hack@0.6.45,cargo-public-api@0.52.0
      - name: Strict Clippy feature powerset
        run: just lint-rust
      - name: Public API feature powerset
        run: just api-matrix
      - name: Public API snapshots
        run: just public-api
      - name: Stable rustdoc
        run: just doc
      - name: docs.rs rustdoc
        run: just doc-docsrs
      - name: MSRV feature powerset
        run: just msrv
      - name: Windows architecture checks
        run: just cross-targets

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
        rust: [stable, "1.75"]
        include:
          - os: windows-2022
            expect_release: "0"
          - os: windows-latest
            expect_release: "1"
    runs-on: ${{ matrix.os }}
    env:
      CONPTY_OXIDE_EXPECT_RELEASE: ${{ matrix.expect_release }}
      CONPTY_OXIDE_TEST_DLL_DIR: ${{ github.workspace }}/vendor/conpty
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The contributor-automation crate always builds with stable, so install
      # it alongside the matrix toolchain; the matrix toolchain is installed
      # last and stays the default the tests run under.
      - name: Install stable Rust for contributor tools
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Install the test toolchain
        env:
          TEST_RUST: ${{ matrix.rust }}
        run: rustup toolchain install $env:TEST_RUST --profile minimal --no-self-update
      - name: Select the test toolchain
        env:
          TEST_RUST: ${{ matrix.rust }}
        run: rustup default $env:TEST_RUST
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf  # v2.85.2
        with:
          tool: just@1.57.0,cargo-nextest@0.9.140
      - name: Cache the ConPTY package
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: vendor/.package
          key: conpty-package-${{ hashFiles('xtask/src/fetch_conpty.rs') }}
      - name: Fetch and validate the bundled ConPTY
        run: just fetch-conpty
        env:
          # The xtask lockfile and dependencies track stable Rust; the MSRV
          # legs only pin the toolchain the published crate is tested with.
          RUSTUP_TOOLCHAIN: stable
      - name: Run nextest and doctests
        run: just test-ci
      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: junit-${{ matrix.os }}-${{ matrix.rust }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: error

  coverage:
    name: Coverage
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CONPTY_OXIDE_TEST_DLL_DIR: ${{ github.workspace }}/vendor/conpty
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install coverage tools
        run: rustup toolchain install stable --profile minimal --component llvm-tools-preview --no-self-update
      - name: Select stable Rust
        run: rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf  # v2.85.2
        with:
          tool: just@1.57.0,cargo-nextest@0.9.140,cargo-llvm-cov@0.8.7
      - name: Cache the ConPTY package
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: vendor/.package
          key: conpty-package-${{ hashFiles('xtask/src/fetch_conpty.rs') }}
      - name: Generate and enforce coverage
        run: just coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage
          path: target/llvm-cov
          if-no-files-found: error

  package:
    name: Published package
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install the minimum Rust version
        run: rustup toolchain install 1.75.0 --profile minimal --no-self-update
      # Keep stable as the default for packaging; check-package selects 1.75
      # explicitly when it creates and runs the fresh external consumers.
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Select stable Rust
        run: rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf  # v2.85.2
        with:
          tool: just@1.57.0
      - name: Inspect and smoke-test the published package
        run: just package-check

  # Everything above tests the crate. Nothing above touches the release path,
  # which is why every defect in it so far only appeared during a release: a
  # path dependency that broke `cargo metadata`, a `release_always` setting
  # that made the crate unreleasable, a runner that cannot build the crate
  # `cargo publish` verifies. This job runs the real release action with
  # `dry_run`, so it downloads the same actions (including the ones release-plz
  # itself calls), parses the same configuration, and performs the same publish
  # verification build -- without uploading anything.
  release-dry-run:
    name: Release dry run
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: stable
      - uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9  # v0.5.131
        with:
          command: release
          version: 0.3.160
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci-required:
    name: CI required
    if: always()
    needs: [policy, hygiene, test, coverage, package, release-dry-run]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every required job succeeded
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: exit 1

  # The one status check branch protection requires,
  # named the same in every P4suta repository.
  # It passes only when every job it needs succeeded or was skipped.
  required:
    name: required
    if: always()
    needs: [ci-required]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail unless every needed job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "${RESULTS}"
          jq -e 'all(.[]; IN("success", "skipped"))' <<< "${RESULTS}"
