name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    name: Hygiene
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1 (stable)
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy (no default features)
        run: cargo clippy --no-default-features --all-targets -- -D warnings
      - name: clippy (default features)
        run: cargo clippy --all-targets -- -D warnings
      - name: clippy (tokio)
        run: cargo clippy --features tokio --all-targets -- -D warnings
      - name: clippy (all features)
        run: cargo clippy --all-features --all-targets -- -D warnings
      - name: typos
        uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # v1.48.0

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
        rust: [stable, "1.75"]
        # Pin which ConPTY lifecycle mode each leg is expected to exercise:
        # Server 2022 predates ReleasePseudoConsole (legacy shutdown path),
        # windows-latest (Server 2025, build 26100+) exports it (released
        # path). The suite asserts this via CONPTY_OXIDE_EXPECT_RELEASE, so a
        # matrix or runner-image change that silently drops one mode's
        # coverage fails loudly instead.
        include:
          - os: windows-2022
            expect_release: "0"
          - os: windows-latest
            expect_release: "1"
    runs-on: ${{ matrix.os }}
    env:
      CONPTY_OXIDE_EXPECT_RELEASE: ${{ matrix.expect_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-nextest
      - name: build
        run: cargo build --all-features
      - name: test
        run: cargo nextest run --all-features --no-tests=pass

  ci-required:
    name: CI required
    if: always()
    needs: [hygiene, test]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
