name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy:
    name: Repository policy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14  # v4
        with:
          version: 2026.7.13
      - name: Install the pinned PowerShell analyzer
        run: just setup-powershell-lint
      - name: Run repository policy
        run: just policy

  hygiene:
    name: Rust hygiene
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc, i686-pc-windows-msvc, aarch64-pc-windows-msvc
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: nightly-2026-07-02
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: "1.75"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf  # v2.85.2
        with:
          tool: just@1.57.0,cargo-hack@0.6.45,cargo-public-api@0.52.0
      - name: Strict Clippy feature powerset
        run: just lint-rust
      - name: Public API feature powerset
        run: just api-matrix
      - name: Public API snapshots
        run: just public-api
      - name: Stable rustdoc
        run: just doc
      - name: docs.rs rustdoc
        run: just doc-docsrs
      - name: MSRV feature powerset
        run: just msrv
      - name: Windows architecture checks
        run: just cross-targets

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
        rust: [stable, "1.75"]
        include:
          - os: windows-2022
            expect_release: "0"
          - os: windows-latest
            expect_release: "1"
    runs-on: ${{ matrix.os }}
    env:
      CONPTY_OXIDE_EXPECT_RELEASE: ${{ matrix.expect_release }}
      CONPTY_OXIDE_TEST_DLL_DIR: ${{ github.workspace }}/vendor/conpty
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf  # v2.85.2
        with:
          tool: just@1.57.0,cargo-nextest@0.9.140
      - name: Cache the ConPTY package
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: vendor/.package
          key: conpty-package-${{ hashFiles('scripts/fetch-conpty.ps1') }}
      - name: Fetch and validate the bundled ConPTY
        run: just fetch-conpty
      - name: Run nextest and doctests
        run: just test-ci
      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: junit-${{ matrix.os }}-${{ matrix.rust }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: error

  coverage:
    name: Coverage
    runs-on: windows-latest
    env:
      CONPTY_OXIDE_TEST_DLL_DIR: ${{ github.workspace }}/vendor/conpty
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf  # v2.85.2
        with:
          tool: just@1.57.0,cargo-nextest@0.9.140,cargo-llvm-cov@0.8.7
      - name: Cache the ConPTY package
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: vendor/.package
          key: conpty-package-${{ hashFiles('scripts/fetch-conpty.ps1') }}
      - name: Generate and enforce coverage
        run: just coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage
          path: target/llvm-cov
          if-no-files-found: error

  package:
    name: Published package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f9afabf  # v2.85.2
        with:
          tool: just@1.57.0
      - name: Inspect and smoke-test the published package
        run: just package-check

  ci-required:
    name: CI required
    if: always()
    needs: [policy, hygiene, test, coverage, package]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every required job succeeded
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: exit 1
