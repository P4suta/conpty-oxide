# The soak repeats teardown races 64 times in one process to expose handle and process leaks.
# Dispatch it for the exact release candidate to enable the environment-gated test.
name: Lifecycle soak

"on":
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  soak:
    name: Lifecycle soak
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Server 2022 has no ReleasePseudoConsole export and exercises the
        # legacy close worker; Server 2025 has it. The teardown paths differ,
        # so both need the repetition.
        os: [windows-2022, windows-latest]
    env:
      CONPTY_OXIDE_TEST_DLL_DIR: ${{ github.workspace }}/vendor/conpty
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Select stable Rust
        run: rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf  # v2.85.2
        with:
          tool: just@1.57.0
      - name: Cache the ConPTY package
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: vendor/.package
          key: conpty-package-${{ hashFiles('xtask/src/fetch_conpty.rs') }}
      - name: Fetch the ConPTY bundle
        run: just fetch-conpty
      - name: Run the lifecycle soak
        run: just soak
