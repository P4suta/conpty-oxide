---
# SPDX-FileCopyrightText: 2026 conpty-oxide contributors <https://github.com/P4suta/conpty-oxide/graphs/contributors>
# SPDX-License-Identifier: MIT OR Apache-2.0

name: Release-plz

"on":
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    name: Publish pending crate
    if: >-
      github.repository == 'P4suta/conpty-oxide' &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      )
    runs-on: windows-2022
    timeout-minutes: 45
    environment: release
    permissions:
      actions: write
      contents: read
      id-token: write
    outputs:
      automation-ready: ${{ steps.preflight.outputs.ready }}
      released: ${{ steps.validate-release.outputs.released }}
      tag: ${{ steps.validate-release.outputs.tag }}
      version: ${{ steps.validate-release.outputs.version }}
    steps:
      - name: Check release credentials
        id: preflight
        shell: bash
        env:
          APP_CLIENT_ID: ${{ vars.RELEASE_PLZ_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          BOOTSTRAP_CARGO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -z "$APP_CLIENT_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo "::notice::Release automation is dormant until the release environment secret is configured."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "bootstrap-token=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          if [[ -n "$BOOTSTRAP_CARGO_TOKEN" ]]; then
            echo "bootstrap-token=true" >> "$GITHUB_OUTPUT"
          else
            echo "bootstrap-token=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint the release GitHub App token
        id: app-token
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_PLZ_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read

      - name: Verify the release App identity and scope
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          [[ "$APP_SLUG" == "p4suta-release-plz" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.full_name')" == "$GITHUB_REPOSITORY" ]]

      - name: Check out the tested main commit
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: >-
            ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Rust
        if: steps.preflight.outputs.ready == 'true'
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: stable

      # Once the crates.io trusted publisher exists, no long-lived registry
      # credential is present and release-plz exchanges this job's OIDC token.
      - name: Publish with crates.io trusted publishing
        id: release-trusted
        if: >-
          steps.preflight.outputs.ready == 'true' &&
          steps.preflight.outputs.bootstrap-token == 'false'
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9  # v0.5.131
        with:
          command: release
          version: 0.3.160
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      # crates.io cannot configure a trusted publisher before a crate exists.
      # CARGO_REGISTRY_TOKEN is therefore an optional, first-release-only
      # environment secret and should be removed immediately after v0.1.0.
      - name: Publish the first release with a bootstrap token
        id: release-bootstrap
        if: >-
          steps.preflight.outputs.ready == 'true' &&
          steps.preflight.outputs.bootstrap-token == 'true'
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9  # v0.5.131
        with:
          command: release
          version: 0.3.160
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Validate release-plz output
        id: validate-release
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        env:
          RELEASES: >-
            ${{ steps.release-bootstrap.outputs.releases || steps.release-trusted.outputs.releases }}
          RELEASES_CREATED: >-
            ${{ steps.release-bootstrap.outputs.releases_created || steps.release-trusted.outputs.releases_created }}
        run: |
          set -euo pipefail

          if [[ "$RELEASES_CREATED" != "true" ]]; then
            jq -e 'type == "array" and length == 0' <<< "${RELEASES:-[]}" >/dev/null
            {
              echo "released=false"
              echo "tag="
              echo "version="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          jq -e '
            type == "array" and
            length == 1 and
            .[0].package_name == "conpty-oxide" and
            (.[0].version | type == "string") and
            (.[0].tag | type == "string")
          ' <<< "$RELEASES" >/dev/null

          version="$(jq -r '.[0].version' <<< "$RELEASES")"
          tag="$(jq -r '.[0].tag' <<< "$RELEASES")"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          [[ "$tag" == "v$version" ]]

          manifest_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')"
          [[ "$manifest_version" == "$version" ]]

          release_commit="$(git rev-list -n 1 "$tag")"
          [[ "$release_commit" == "$(git rev-parse HEAD)" ]]

          {
            echo "released=true"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch release finalization at the immutable tag ref
        if: steps.validate-release.outputs.released == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.validate-release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.validate-release.outputs.version }}
        run: |
          gh workflow run release-finalize.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$RELEASE_TAG" \
            -f "tag=$RELEASE_TAG" \
            -f "version=$RELEASE_VERSION"

  release-pr:
    name: Maintain release PR
    needs: release
    if: >-
      needs.release.result == 'success' &&
      needs.release.outputs.automation-ready == 'true'
    runs-on: windows-2022
    timeout-minutes: 45
    environment: release
    concurrency:
      group: release-plz-pr-main
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Mint the release GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_PLZ_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Verify the release App identity and scope
        shell: bash
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          [[ "$APP_SLUG" == "p4suta-release-plz" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.full_name')" == "$GITHUB_REPOSITORY" ]]

      - name: Require the tested commit to still be current main
        id: freshness
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TESTED_SHA: >-
            ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$TESTED_SHA" != "$main_sha" ]]; then
            echo "::notice::Skipping stale release PR update for $TESTED_SHA; current main is $main_sha."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Check out the tested main commit
        if: steps.freshness.outputs.current == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: >-
            ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Rust
        if: steps.freshness.outputs.current == 'true'
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: stable

      - name: Create or update the release PR
        if: steps.freshness.outputs.current == 'true'
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9  # v0.5.131
        with:
          command: release-pr
          version: 0.3.160
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
