# SPDX-FileCopyrightText: 2026 conpty-oxide contributors <https://github.com/P4suta/conpty-oxide/graphs/contributors>
# SPDX-License-Identifier: MIT OR Apache-2.0

# The upstream-recommended release-plz workflow. Two deviations from the
# quickstart, both for reasons release-plz's own documentation gives:
#
#   * A GitHub App token instead of GITHUB_TOKEN. The default token cannot
#     trigger other workflows, so CI would never run on a release pull request.
#   * `environment: release` on both jobs. The crates.io trusted publisher is
#     bound to this repository, this workflow file, and that environment, so no
#     registry token exists anywhere; the App credentials are scoped to it too,
#     so neither job can mint a token without it. The environment carries a
#     branch policy, not a reviewer gate: merging the release pull request is
#     what authorises a release.
name: Release-plz

"on":
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release-plz release
    if: github.repository == 'P4suta/conpty-oxide'
    # Windows, not the ubuntu-latest of the upstream template. `cargo publish`
    # verifies the tarball by building it, and this crate is Windows-only: on
    # Linux the `cfg(windows)` dependency on windows-spawn is absent while the
    # modules that use it still compile, so verification fails. Nothing else in
    # CI builds on Linux, so this only ever surfaces here.
    runs-on: windows-2022
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
      id-token: write
    outputs:
      released: ${{ steps.run.outputs.releases_created }}
      tag: ${{ steps.released.outputs.tag }}
      version: ${{ steps.released.outputs.version }}
    steps:
      - name: Mint the release GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_PLZ_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: stable
      - name: Run release-plz
        id: run
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9  # v0.5.131
        with:
          command: release
          version: 0.3.160
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Read the released tag and version
        id: released
        if: steps.run.outputs.releases_created == 'true'
        shell: bash
        env:
          RELEASES: ${{ steps.run.outputs.releases }}
        run: |
          set -euo pipefail
          jq -r '.[0] | "tag=\(.tag)", "version=\(.version)"' <<< "$RELEASES" >> "$GITHUB_OUTPUT"

  # GitHub does not fire release events for drafts, and this repository uses
  # immutable releases, so assets have to be attached before the release is
  # published. `git_release_draft = true` plus this call is what sequences
  # that; there is no release event to hook instead.
  finalize:
    name: Attest and publish the release
    needs: release
    if: needs.release.outputs.released == 'true'
    # A called workflow can only use permissions the calling job grants.
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/release-finalize.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      version: ${{ needs.release.outputs.version }}

  release-pr:
    name: Release-plz PR
    # Ordered after `release` so a release pull request is never opened for a
    # version that is being published in the same run.
    needs: release
    if: always() && github.repository == 'P4suta/conpty-oxide'
    # Windows for the same reason: release-plz packages the crate to compare it
    # against the registry, and cargo-semver-checks builds the public API.
    runs-on: windows-2022
    timeout-minutes: 30
    # The App credentials are scoped to this environment, so both jobs need it
    # to mint a token at all.
    environment: release
    permissions: {}
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Mint the release GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_PLZ_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: stable
      # `semver_check = true` in .release-plz.toml needs this on PATH.
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf  # v2.85.2
        with:
          tool: cargo-semver-checks@0.45.0
      - name: Run release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9  # v0.5.131
        with:
          command: release-pr
          version: 0.3.160
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
