[package]
name = "xtask"
version = "0.0.0"
edition = "2021"
description = "Contributor automation for the conpty-oxide repository."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
flate2 = "1"
pelite = "0.10"
regex = "1"
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
ureq = "2"

# The NuGet package only contains stored and deflate entries; the default
# crypto and extra-compression features would only widen the dependency tree.
[dependencies.zip]
version = "2"
default-features = false
features = ["deflate"]

# An empty workspace table detaches this tool from the published crate so
# contributor automation never affects its lockfile, lints, packaging, or
# release checks.
[workspace]
