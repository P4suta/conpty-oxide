[package]
name = "xtask"
version = "0.0.0"
edition = "2021"
description = "Contributor automation for the conpty-oxide repository."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
pelite = "0.10"
regex = "1"
sha2 = "0.10"
ureq = "2"
zip = "2"

# An empty workspace table detaches this tool from the published crate so
# contributor automation never affects its lockfile, lints, packaging, or
# release checks.
[workspace]
